site_name: Async Durable Execution for Python
site_description: Async-first durable execution SDK for AWS Lambda
site_url: https://zhongkechen.github.io/async-durable-execution/
repo_url: https://github.com/zhongkechen/async-durable-execution
repo_name: zhongkechen/async-durable-execution
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: build/docs
use_directory_urls: false

theme:
  name: material
  language: en
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Use light mode
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Guides:
      - Advanced Usage: advanced-usage.md
      - Using Synchronous Code: using-synchronous-code.md
      - Migrating from the Official SDK: migrating-from-official-python-sdk.md
      - Official SDK Comparison: official-python-sdk-comparison.md
      - Runner Architecture: runner-architecture.md
  - API Reference:
      - Overview: async_durable_execution.md
      - Durable Operations: api/operations.md
      - DAG Workflows: api/dag.md
      - Composition: api/composition.md
      - Configuration and Serialization: api/configuration.md
      - Testing: async_durable_execution/runner.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - async-durable-execution/src
          options:
            docstring_style: google
            docstring_options:
              returns_multiple_items: false
            filters:
              - "!^_"
            heading_level: 2
            inherited_members: false
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_category_heading: true
            show_root_full_path: false
            show_root_heading: false
            show_signature_annotations: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

copyright: Copyright Zhongke Chen. Licensed under Apache License 2.0.
