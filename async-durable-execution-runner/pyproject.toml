[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Modified fork metadata for async-durable-execution; upstream Apache-2.0 notices are preserved in the repository LICENSE and NOTICE files.
[project]
name = "async-durable-execution-runner"
dynamic = ["version"]
description = "Deprecated compatibility package; runner helpers now ship in async-durable-execution"
readme = "../README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = []
authors = [{ name = "Zhongke Chen" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "async-durable-execution>=2.0.0b2",
]

[project.urls]
Documentation = "https://github.com/zhongkechen/async-durable-execution#readme"
Issues = "https://github.com/zhongkechen/async-durable-execution/issues"
Source = "https://github.com/zhongkechen/async-durable-execution"

[tool.hatch.build.targets.sdist]
packages = ["src/async_durable_execution_runner"]

[tool.hatch.build.targets.sdist.force-include]
"../LICENSE" = "LICENSE"
"../NOTICE" = "NOTICE"
"../VERSION.py" = "VERSION.py"

[tool.hatch.build.targets.wheel]
packages = ["src/async_durable_execution_runner"]

[tool.hatch.build.targets.wheel.force-include]
"../LICENSE" = "LICENSE"
"../NOTICE" = "NOTICE"
"../VERSION.py" = "VERSION.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
path = "../VERSION.py"

[tool.coverage.run]
source_pkgs = ["async_durable_execution_runner"]
branch = true
parallel = true
omit = ["src/async_durable_execution_runner/__about__.py", "test_runner/*"]

[tool.coverage.paths]
async_durable_execution_runner = [
  "src/async_durable_execution_runner",
  "*/async-durable-execution-runner/src/async_durable_execution_runner",
]
tests = [
  "test_runner",
  "*/async-durable-execution-runner/test_runner",
]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "@abstractmethod",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
preview = false
select = []

[tool.ruff.lint.isort]
known-first-party = ["async_durable_execution_runner"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
"test_runner/**" = [
  "ARG001",
  "ARG002",
  "ARG005",
  "S101",
  "PLR2004",
  "SIM117",
  "TRY301",
]
"src/async_durable_execution_runner/invoker.py" = [
  "A002", # Argument `input` is shadowing a Python builtin
]

[tool.pytest.ini_options]
# Default test discovery paths
testpaths = ["test_runner"]
# Default options for all test runs
addopts = "-v --strict-markers"
asyncio_mode = "auto"
