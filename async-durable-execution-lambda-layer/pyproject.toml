[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Modified fork metadata for async-durable-execution; upstream Apache-2.0 notices are preserved in the repository LICENSE and NOTICE files.
[project]
name = "async-durable-execution-lambda-layer"
dynamic = ["version"]
description = "Build AWS Lambda layers that vendor the async durable execution SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Zhongke Chen" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.scripts]
async-durable-execution-build-layer = "async_durable_execution_lambda_layer.builder:main"

[project.urls]
Documentation = "https://github.com/zhongkechen/async-durable-execution#readme"
Issues = "https://github.com/zhongkechen/async-durable-execution/issues"
Source = "https://github.com/zhongkechen/async-durable-execution"

[tool.hatch.version]
path = "../VERSION.py"

[tool.hatch.build.targets.sdist]
packages = ["src/async_durable_execution_lambda_layer"]

[tool.hatch.build.targets.sdist.force-include]
"../LICENSE" = "LICENSE"
"../NOTICE" = "NOTICE"
"../VERSION.py" = "VERSION.py"

[tool.hatch.build.targets.wheel]
packages = ["src/async_durable_execution_lambda_layer"]

[tool.hatch.build.targets.wheel.force-include]
"../LICENSE" = "LICENSE"
"../NOTICE" = "NOTICE"
"../VERSION.py" = "VERSION.py"

[tool.coverage.run]
source_pkgs = ["async_durable_execution_lambda_layer"]
branch = true
parallel = true

[tool.coverage.paths]
async_durable_execution_lambda_layer = [
  "src/async_durable_execution_lambda_layer",
  "*/async-durable-execution-lambda-layer/src/async_durable_execution_lambda_layer",
]
tests = [
  "test_layer",
  "*/async-durable-execution-lambda-layer/test_layer",
]

[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
preview = true
select = []

[tool.ruff.lint.isort]
known-first-party = ["async_durable_execution_lambda_layer"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
"test_layer/**" = [
  "ARG001",
  "ARG002",
  "ARG005",
  "S101",
  "PLR2004",
  "SIM117",
  "TRY301",
]

[tool.pytest.ini_options]
testpaths = ["test_layer"]
addopts = "-v --strict-markers"
