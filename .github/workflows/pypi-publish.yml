# This workflow will upload Python Packages to PyPI when a release is created
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload PyPI Package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - artifact_name: async-durable-execution
            publish_url: https://pypi.org/project/async-durable-execution/
            path: async-durable-execution

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"

      - name: Install Hatch
        run: python -m pip install --upgrade hatch==1.16.5

      - name: Build release distributions
        working-directory: ${{ matrix.package.path }}
        run: hatch build

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-dists-${{ matrix.package.artifact_name }}
          path: ${{ matrix.package.path }}/dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    strategy:
      fail-fast: false
      matrix:
        package:
          - artifact_name: async-durable-execution
            environment_name: async-durable-execution
            publish_url: https://pypi.org/project/async-durable-execution/
    permissions:
      id-token: write

    environment:
      name: ${{ matrix.package.environment_name }}
      url: ${{ matrix.package.publish_url }}

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-dists-${{ matrix.package.artifact_name }}
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: dist/
