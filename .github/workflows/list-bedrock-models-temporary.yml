name: List Bedrock Models (Temporary)

on:
  workflow_dispatch:
    inputs:
      region:
        description: AWS region to inspect
        required: true
        default: us-east-1
        type: string
  push:
    paths:
      - ".github/workflows/list-bedrock-models-temporary.yml"

permissions: {}

jobs:
  list-models:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
      AWS_REGION: ${{ inputs.region || 'us-east-1' }}

    steps:
      - name: List Anthropic models and inference profiles
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${AWS_BEARER_TOKEN_BEDROCK:-}" ]]; then
            echo "::error::AWS_BEARER_TOKEN_BEDROCK is not configured"
            exit 1
          fi

          endpoint="https://bedrock.${AWS_REGION}.amazonaws.com"
          auth_header="Authorization: Bearer ${AWS_BEARER_TOKEN_BEDROCK}"

          curl --fail-with-body --silent --show-error \
            -H "$auth_header" \
            "${endpoint}/foundation-models?byProvider=Anthropic&byOutputModality=TEXT" \
            -o "${RUNNER_TEMP}/foundation-models.json"

          curl --fail-with-body --silent --show-error \
            -H "$auth_header" \
            "${endpoint}/inference-profiles?maxResults=1000&type=SYSTEM_DEFINED" \
            -o "${RUNNER_TEMP}/inference-profiles.json"

          {
            echo "## Anthropic foundation models in \`${AWS_REGION}\`"
            echo
            echo '```text'
            printf '%-58s  %-30s  %-18s  %s\n' \
              "MODEL ID" "NAME" "INFERENCE TYPES" "STATUS"
            jq -r '
              .modelSummaries
              | sort_by(.modelName)
              | .[]
              | [
                  .modelId,
                  .modelName,
                  (.inferenceTypesSupported | join(",")),
                  .modelLifecycle.status
                ]
              | @tsv
            ' "${RUNNER_TEMP}/foundation-models.json" |
              while IFS=$'\t' read -r id name types status; do
                printf '%-58s  %-30s  %-18s  %s\n' \
                  "$id" "$name" "$types" "$status"
              done
            echo '```'
            echo
            echo "## Anthropic system inference profiles"
            echo
            echo '```text'
            printf '%-58s  %-12s  %s\n' "PROFILE ID" "STATUS" "NAME"
            jq -r '
              .inferenceProfileSummaries
              | map(select(.inferenceProfileId | contains(".anthropic.")))
              | sort_by(.inferenceProfileName)
              | .[]
              | [.inferenceProfileId, .status, .inferenceProfileName]
              | @tsv
            ' "${RUNNER_TEMP}/inference-profiles.json" |
              while IFS=$'\t' read -r id status name; do
                printf '%-58s  %-12s  %s\n' "$id" "$status" "$name"
              done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
