name: Publish Lambda Layer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      sdk-ref:
        description: Git ref to build into the layer, such as main or v2.0.0a2
        required: true
        default: main
      aws-regions:
        description: Optional comma, space, or newline-separated AWS Regions; empty publishes to all enabled commercial regions
        required: false
        default: ""
      layer-name:
        description: Lambda layer name
        required: true
        default: async-durable-execution
      share-principals:
        description: Comma, space, or newline-separated AWS account IDs, organization IDs, or * for public sharing
        required: false
        default: ""
      description:
        description: Lambda layer version description
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: lambda-layer-publish-${{ github.event.release.tag_name || inputs['sdk-ref'] || github.ref }}
  cancel-in-progress: false

env:
  SDK_REF: ${{ inputs['sdk-ref'] || github.event.release.tag_name || github.ref_name }}
  REQUESTED_AWS_REGIONS: ${{ inputs['aws-regions'] || vars.LAMBDA_LAYER_AWS_REGIONS }}
  DEFAULT_AWS_REGION: us-east-1
  LAYER_NAME: ${{ inputs['layer-name'] || vars.LAMBDA_LAYER_NAME || 'async-durable-execution' }}
  LAYER_DESCRIPTION: ${{ inputs.description }}
  SHARE_PRINCIPALS: ${{ inputs['share-principals'] || secrets.AWS_ACCOUNT_ID || vars.LAMBDA_LAYER_SHARE_PRINCIPALS }}
  ROLE_TO_ASSUME: ${{ secrets.ACTIONS_LAYER_PUBLISH_ROLE_ARN || secrets.ACTIONS_INTEGRATION_ROLE_NAME }}
  LAYER_ZIP: dist/async-durable-execution-layer.zip

jobs:
  build-layer:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SDK_REF }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Hatch
        run: python -m pip install --upgrade hatch==1.16.5

      - name: Build Lambda layer zip
        run: |
          hatch run python scripts/build_layer.py \
            --sdk-source ./async-durable-execution \
            --output "$LAYER_ZIP" \
            --verbose

      - name: Upload layer zip artifact
        uses: actions/upload-artifact@v7
        with:
          name: async-durable-execution-layer
          path: ${{ env.LAYER_ZIP }}

  resolve-regions:
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ steps.regions.outputs.regions }}

    steps:
      - name: Verify AWS publish role is configured
        run: |
          if [ -z "$ROLE_TO_ASSUME" ]; then
            echo "Set ACTIONS_LAYER_PUBLISH_ROLE_ARN or ACTIONS_INTEGRATION_ROLE_NAME before publishing a layer." >&2
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          role-session-name: asyncDurableExecutionLayerRegionDiscovery
          aws-region: ${{ env.DEFAULT_AWS_REGION }}

      - name: Resolve commercial AWS Regions
        id: regions
        run: |
          set -euo pipefail

          if [ -n "${REQUESTED_AWS_REGIONS:-}" ]; then
            regions_json="$(
              python3 -c 'import json, os, re; regions = [r for r in re.split(r"[\s,]+", os.environ.get("REQUESTED_AWS_REGIONS", "").strip()) if r]; print(json.dumps(regions))'
            )"
          else
            regions_json="$(
              aws ec2 describe-regions \
                --all-regions \
                --filters Name=opt-in-status,Values=opt-in-not-required,opted-in \
                --query 'sort_by(Regions, &RegionName)[].RegionName' \
                --output json
            )"
          fi

          if [ "$regions_json" = "[]" ]; then
            echo "No AWS Regions resolved for Lambda layer publishing." >&2
            exit 1
          fi

          echo "regions=${regions_json}" >> "$GITHUB_OUTPUT"
          echo "Publishing to regions: ${regions_json}"

  publish-layer:
    runs-on: ubuntu-latest
    needs:
      - build-layer
      - resolve-regions
    strategy:
      fail-fast: false
      matrix:
        aws-region: ${{ fromJson(needs.resolve-regions.outputs.regions) }}

    steps:
      - name: Download layer zip artifact
        uses: actions/download-artifact@v8
        with:
          name: async-durable-execution-layer
          path: dist/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          role-session-name: asyncDurableExecutionLayerPublish
          aws-region: ${{ matrix.aws-region }}

      - name: Publish Lambda layer version
        id: publish
        run: |
          set -euo pipefail

          description="${LAYER_DESCRIPTION:-async-durable-execution SDK ${SDK_REF}}"

          read -r version layer_version_arn < <(
            aws lambda publish-layer-version \
              --layer-name "$LAYER_NAME" \
              --description "$description" \
              --zip-file "fileb://${LAYER_ZIP}" \
              --compatible-runtimes python3.10 python3.11 python3.12 python3.13 python3.14 \
              --compatible-architectures x86_64 arm64 \
              --license-info Apache-2.0 \
              --query '[Version, LayerVersionArn]' \
              --output text
          )

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "layer-version-arn=${layer_version_arn}" >> "$GITHUB_OUTPUT"
          echo "Published ${layer_version_arn}"

      - name: Share Lambda layer version
        if: env.SHARE_PRINCIPALS != ''
        run: |
          set -euo pipefail

          normalized_principals="${SHARE_PRINCIPALS//,/ }"
          normalized_principals="${normalized_principals//$'\n'/ }"
          read -r -a principals <<< "$normalized_principals"

          for principal in "${principals[@]}"; do
            statement_id="share-${{ steps.publish.outputs.version }}-$(printf '%s' "$principal" | tr -c '[:alnum:]' '-' | cut -c1-80)"

            if [[ "$principal" == o-* ]]; then
              aws lambda add-layer-version-permission \
                --layer-name "$LAYER_NAME" \
                --version-number "${{ steps.publish.outputs.version }}" \
                --statement-id "$statement_id" \
                --action lambda:GetLayerVersion \
                --principal "*" \
                --organization-id "$principal"
            else
              aws lambda add-layer-version-permission \
                --layer-name "$LAYER_NAME" \
                --version-number "${{ steps.publish.outputs.version }}" \
                --statement-id "$statement_id" \
                --action lambda:GetLayerVersion \
                --principal "$principal"
            fi

            echo "Shared layer version ${{ steps.publish.outputs.version }} with ${principal}"
          done

      - name: Summarize published layer
        run: |
          {
            echo "### Published Lambda layer"
            echo ""
            echo "- Layer ARN: \`${{ steps.publish.outputs.layer-version-arn }}\`"
            echo "- Version: \`${{ steps.publish.outputs.version }}\`"
            echo "- Source ref: \`${SDK_REF}\`"
            echo "- Region: \`${{ matrix.aws-region }}\`"
            echo "- Shared with: \`${SHARE_PRINCIPALS:-not shared}\`"
          } >> "$GITHUB_STEP_SUMMARY"
