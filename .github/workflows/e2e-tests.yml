name: E2E Tests

on:
  push:
    branches: [ main ]

  pull_request:
    branches: ["main"]
    paths:
      - 'async_durable_execution/**'
      - 'examples/**'
      - 'test_examples/**'
      - 'pyproject.toml'
      - 'scripts/**'
      - '.github/workflows/e2e-tests.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

permissions:
  id-token: write
  contents: read

concurrency:
  group: cloud-test
  cancel-in-progress: false

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: ${{ matrix.python-version == '3.15' }}

    - name: Configure AWS credentials
      if: github.event_name != 'workflow_dispatch' || github.actor != 'nektos/act'
      uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
      with:
        role-to-assume: "${{ secrets.ACTIONS_INTEGRATION_ROLE_NAME }}"
        role-session-name: pythonTestingLibraryGitHubIntegrationTest
        aws-region: ${{ env.AWS_REGION }}

    - name: Install Hatch
      run: pip install hatch
    - name: Setup SAM CLI
      uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3

    - name: Build SDK Lambda layer
      run: |
        if [ "${{ matrix.python-version }}" = "3.15" ]; then
          # Use the Botocore fallback until aiohttp publishes Lambda-compatible 3.15 wheels.
          python scripts/build_layer.py \
            --sdk-source . \
            --output dist/async-durable-execution-layer.zip
        else
          hatch run examples:build-layer
        fi

    - name: Build examples
      run: hatch run examples:build

    - name: Generate SAM template
      run: |
        python scripts/generate_sam_template.py \
          --runtime "python${{ matrix.python-version }}" \
          --output template.generated.json

    - name: Deploy all examples with SAM
      id: deploy
      env:
        LAMBDA_ENDPOINT: "https://lambda.${{ env.AWS_REGION }}.amazonaws.com"
      run: |
        PYTHON_VERSION_TAG=$(echo "${{ matrix.python-version }}" | tr -d '.')

        STACK_NAME="python-examples-py${PYTHON_VERSION_TAG}"
        FUNCTION_NAME_PREFIX="py${PYTHON_VERSION_TAG}-"

        STACK_NAME=$(echo "$STACK_NAME" | tr -cd '[:alnum:]-' | cut -c1-128)

        TEMPLATE_FILE="template.generated.json"
        if [ "${{ matrix.python-version }}" != "3.15" ]; then
          echo "Building SAM application"
          sam build --template-file "$TEMPLATE_FILE"
          TEMPLATE_FILE=".aws-sam/build/template.yaml"
        else
          echo "Deploying prebuilt artifacts because SAM CLI does not yet build the preview runtime"
        fi

        echo "Deploying stack $STACK_NAME with function prefix $FUNCTION_NAME_PREFIX"
        sam deploy \
          --template-file "$TEMPLATE_FILE" \
          --stack-name "$STACK_NAME" \
          --resolve-s3 \
          --capabilities CAPABILITY_IAM \
          --no-confirm-changeset \
          --no-fail-on-empty-changeset \
          --region "$AWS_REGION" \
          --parameter-overrides \
            FunctionNamePrefix="$FUNCTION_NAME_PREFIX" \
            LambdaEndpoint="$LAMBDA_ENDPOINT"

        echo "PYTEST_FUNCTION_NAME_PREFIX=$FUNCTION_NAME_PREFIX" >> $GITHUB_ENV
        echo "STACK_NAME=$STACK_NAME" >> $GITHUB_ENV

    - name: Run Integration Tests
      env:
        AWS_REGION: ${{ env.AWS_REGION }}
        LAMBDA_ENDPOINT: "https://lambda.${{ env.AWS_REGION }}.amazonaws.com"
        PYTEST_FUNCTION_NAME_PREFIX: ${{ env.PYTEST_FUNCTION_NAME_PREFIX }}
      run: |
        echo "Running integration tests for all deployed examples"
        echo "AWS Region: ${AWS_REGION}"
        echo "Lambda Endpoint: ${LAMBDA_ENDPOINT}"
        echo "Configured function prefix: ${PYTEST_FUNCTION_NAME_PREFIX}"

        hatch run test:examples-integration -- -n 4 --dist worksteal
