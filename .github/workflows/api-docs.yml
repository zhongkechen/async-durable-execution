name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "async-durable-execution/src/**"
      - "async-durable-execution/test_sdk/**"
      - "async-durable-execution/pyproject.toml"
      - "async-durable-execution-examples/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/api-docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "async-durable-execution/src/**"
      - "async-durable-execution/test_sdk/**"
      - "async-durable-execution/pyproject.toml"
      - "async-durable-execution-examples/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/api-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-site:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install Hatch
        run: python -m pip install hatch==1.16.5

      - name: Build API docs from docstrings
        run: hatch run docs:build

      - name: Preserve API docs at site root
        run: |
          cp -R site/api/. site/
          rm -rf site/api

      - name: Build HTML coverage report
        run: hatch run test:cov-html

      - name: Upload GitHub Pages preview artifact
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: github-pages-html
          path: site
          if-no-files-found: error

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy-site:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build-site
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
