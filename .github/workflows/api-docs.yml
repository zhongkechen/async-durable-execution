name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "async_durable_execution/**"
      - "test_sdk/**"
      - "examples/**"
      - "test_examples/**"
      - "docs/**"
      - "scripts/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - ".github/workflows/api-docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "async_durable_execution/**"
      - "test_sdk/**"
      - "examples/**"
      - "test_examples/**"
      - "docs/**"
      - "scripts/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - ".github/workflows/api-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-site:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Hatch
        run: python -m pip install hatch==1.16.5

      - name: Build documentation site
        run: hatch run docs:build

      - name: Assemble documentation at site root
        run: |
          cp -R build/docs/. site/
          test -f site/api/operations.html
          test -f site/api/composition.html
          test -f site/api/configuration.html

      - name: Build HTML coverage report
        run: hatch run test:cov-html

      - name: Build coverage badge
        run: python3 scripts/generate_coverage_badge.py site/coverage/coverage.json site/coverage/badge.svg

      - name: Upload GitHub Pages preview artifact
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-pages-html
          path: site
          if-no-files-found: error

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy-site:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build-site
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
