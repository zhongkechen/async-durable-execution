name: Conformance Tests

on:
  push:
    branches: [main]
    paths:
      - "async-durable-execution/**"
      - "conformance/**"
      - "scripts/build_conformance.py"
      - "scripts/generate_conformance_sam_templates.py"
      - ".github/workflows/conformance-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "async-durable-execution/**"
      - "conformance/**"
      - "scripts/build_conformance.py"
      - "scripts/generate_conformance_sam_templates.py"
      - ".github/workflows/conformance-tests.yml"
  workflow_dispatch:
    inputs:
      aws-region:
        description: AWS Region for the conformance stacks
        required: true
        default: us-east-1
      python-version:
        description: Python runtime for the Lambda functions
        required: true
        type: choice
        default: "3.14"
        options:
          - "3.13"
          - "3.14"

permissions:
  contents: read
  id-token: write

concurrency:
  group: conformance-deploy-${{ inputs['aws-region'] || 'us-east-1' }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ inputs['aws-region'] || 'us-east-1' }}
  PYTHON_VERSION: ${{ inputs['python-version'] || '3.14' }}

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Generate SAM templates
        run: |
          python scripts/generate_conformance_sam_templates.py \
            --runtime "python${PYTHON_VERSION}"

      - name: Build Lambda bundle
        run: python scripts/build_conformance.py

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v7
        with:
          name: conformance-deployment
          path: |
            conformance/build
            conformance/generated
          retention-days: 1

  conformance-tests:
    name: Conformance tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        suite:
          - step
          - wait
          - child
          - callback
          - invoke
          - wait_for_condition
          - wait_for_callback
          - parallel
          - map

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v8
        with:
          name: conformance-deployment
          path: conformance

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install conformance test runner
        run: python -m pip install aws-durable-execution-conformance-tests==0.1.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.ACTIONS_INTEGRATION_ROLE_NAME }}
          role-session-name: pythonConformanceTests
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v3

      - name: Run ${{ matrix.suite }} conformance tests
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail

          suite_name="${SUITE//_/-}"
          results_dir="${GITHUB_WORKSPACE}/conformance-results/${SUITE}"
          mkdir -p "$results_dir"

          python -m aws_durable_execution_conformance_tests.app \
            --template "${GITHUB_WORKSPACE}/conformance/generated/template_${SUITE}.json" \
            --language python \
            --region "$AWS_REGION" \
            --name "python-${suite_name}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --suite "$SUITE" \
            --history-dir "$results_dir" \
            --report console json junit \
            --report-file "${results_dir}/report" \
            --fail-on failed+uncovered

      - name: Upload ${{ matrix.suite }} conformance results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conformance-results-${{ matrix.suite }}
          path: conformance-results/${{ matrix.suite }}
          if-no-files-found: warn
          retention-days: 14
