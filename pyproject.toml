[project]
name = "async-durable-execution-monorepo"
dynamic = ["version"]
requires-python = ">=3.10"

[tool.hatch.version]
path = "VERSION.py"

[tool.hatch.envs.default]
workspace.members = [
  "async-durable-execution",
  "async-durable-execution-examples",
]

[tool.hatch.envs.test]
workspace.members = [
  "async-durable-execution",
  "async-durable-execution-examples",
]
dependencies = [
  "coverage[toml]",
  "mypy>=1.0.0",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "pytest-xdist",
  "botocore-stubs>=1.42.40,<1.43.0",
]

[tool.hatch.envs.test.scripts]
all = "pytest {args}"
cov = "pytest --cov-report=term-missing --cov-config=pyproject.toml --cov=async-durable-execution/src/async_durable_execution --cov=scripts {args}"
cov-html = "pytest --cov-report=term-missing --cov-report=html:site/coverage --cov-report=json:site/coverage/coverage.json --cov-config=pyproject.toml --cov=async-durable-execution/src/async_durable_execution --cov=scripts {args}"
sdk = "pytest async-durable-execution/test_sdk {args}"
sdk-cov = "pytest --cov-report=term-missing --cov-config=async-durable-execution/pyproject.toml --cov=async-durable-execution/src/async_durable_execution --cov-fail-under=98 async-durable-execution/test_sdk {args}"
runner = "pytest async-durable-execution/test_sdk/runner {args}"
runner-cov = "pytest --cov-report=term-missing --cov-config=async-durable-execution/pyproject.toml --cov=async-durable-execution/src/async_durable_execution/runner --cov-fail-under=95 async-durable-execution/test_sdk/runner {args}"
examples = "pytest async-durable-execution-examples/test_examples {args}"
examples-integration = "pytest --runner-mode=cloud async-durable-execution-examples/test_examples/ -v {args}"
typecheck = "mypy --install-types --non-interactive --warn-unused-ignores {args:async-durable-execution/src/async_durable_execution async-durable-execution/test_sdk scripts}"

[tool.pytest.ini_options]
# Declare custom markers to avoid warnings with --strict-markers
addopts = "-v --strict-markers --import-mode=importlib"
testpaths = [
    "async-durable-execution/test_sdk",
    "async-durable-execution-examples/test_examples",
    "scripts/test_scripts",
]
markers = []
asyncio_mode = "auto"

[tool.coverage.run]
omit = [
  "*/test/**",
  "*/test_*/**",
  "*/tests/**",
  "*/tests_*/**",
  "scripts/test_scripts/**",
]

[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]

[tool.hatch.envs.test-pypi-examples]
dependencies = [
  "async-durable-execution",
  "pytest",
  "pytest-asyncio",
]
pre-install-commands = [
  "pip install -e async-durable-execution-examples",
]

[tool.hatch.envs.test-pypi-examples.scripts]
test = "pytest async-durable-execution-examples/test_examples {args}"

[tool.hatch.envs.examples]
workspace.members = [
  "async-durable-execution",
  "async-durable-execution-examples",
]

[tool.hatch.envs.examples.scripts]
pip = "python -m pip {args}"
generate-sam-template = "python scripts/generate_sam_template.py {args}"
build = "python scripts/build_examples.py"
build-layer = "python scripts/build_layer.py --sdk-source './async-durable-execution[aioboto]' --output dist/async-durable-execution-layer.zip {args}"
clean = "rm -rf async-durable-execution-examples/build async-durable-execution-examples/.aws-sam async-durable-execution-examples/*.zip async-durable-execution-examples/template.generated.json dist"

[tool.hatch.envs.docs]
workspace.members = [
  "async-durable-execution",
]
dependencies = ["pdoc>=15,<16"]

[tool.hatch.envs.docs.scripts]
build = "pdoc async_durable_execution async_durable_execution.runner -o site/api"
clean = "rm -rf site/api"

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [".github/scripts/*.sh", ".github/workflows"]

[tool.ruff.lint]
preview = true
select = []

[tool.ruff.lint.isort]
known-first-party = [
  "async_durable_execution",
  "async_durable_execution_examples",
]
force-single-line = false
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
"**/tests*/**" = [
  "ARG001",
  "ARG002",
  "ARG005",
  "S101",
  "PLR2004",
  "PLR6301",
  "SIM117",
  "TRY301",
]
"**/test/**" = [
  "ARG001",
  "ARG002",
  "ARG005",
  "S101",
  "PLR2004",
  "SIM117",
  "TRY301",
]
