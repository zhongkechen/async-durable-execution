[project]
name = "async-durable-execution-monorepo"
dynamic = ["version"]
requires-python = ">=3.10"

[tool.hatch.version]
path = "VERSION.py"

[tool.hatch.envs.default]
workspace.members = ["packages/*"]

[tool.hatch.envs.test]
workspace.members = ["packages/*"]
dependencies = [
  "coverage[toml]",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "pytest-xdist",
]

[tool.hatch.envs.test.scripts]
all = "pytest {args}"
cov = "pytest --cov-report=term-missing --cov {args}"
examples-integration = "pytest --runner-mode=cloud packages/async-durable-execution-examples/tests_async_durable_execution_examples/ -v {args}"

[tool.pytest.ini_options]
# Declare custom markers to avoid warnings with --strict-markers
addopts = "-v --strict-markers --import-mode=importlib"
testpaths = [
    "packages/async-durable-execution/tests_async_durable_execution",
    "packages/async-durable-execution-runner/tests_async_durable_execution_runner",
    "packages/async-durable-execution-examples/tests_async_durable_execution_examples",
]
markers = []
asyncio_mode = "auto"

[tool.hatch.envs.types]
workspace.members = ["packages/*"]
extra-dependencies = [
  "mypy>=1.0.0",
  "pytest",
  "boto3-stubs[lambda]>=1.42.1",
]

[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:packages/async-durable-execution/src/async_durable_execution packages/async-durable-execution/tests_async_durable_execution packages/async-durable-execution-runner/src/async_durable_execution_runner packages/async-durable-execution-runner/tests_async_durable_execution_runner}"

[tool.hatch.envs.dev-core]
workspace.members = [
  "packages/async-durable-execution",
  "packages/async-durable-execution-runner",
]
dependencies = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "coverage[toml]",
  "mypy>=1.0.0",
  "boto3-stubs[lambda]>=1.42.1",
]

[tool.hatch.envs.dev-core.scripts]
test = "pytest packages/async-durable-execution/tests_async_durable_execution {args}"
cov = "pytest --cov-report=term-missing --cov-config=packages/async-durable-execution/pyproject.toml --cov=packages/async-durable-execution/src/async_durable_execution --cov-fail-under=98 packages/async-durable-execution/tests_async_durable_execution {args}"
typecheck = "mypy --install-types --non-interactive packages/async-durable-execution/src/async_durable_execution packages/async-durable-execution/tests_async_durable_execution"

[tool.hatch.envs.dev-testing]
workspace.members = [
  "packages/async-durable-execution",
  "packages/async-durable-execution-runner",
]
dependencies = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "coverage[toml]",
  "mypy>=1.0.0",
]

[tool.hatch.envs.dev-testing.scripts]
test = "pytest packages/async-durable-execution-runner/tests_async_durable_execution_runner {args}"
cov = "pytest --cov-report=term-missing --cov-config=packages/async-durable-execution-runner/pyproject.toml --cov=packages/async-durable-execution-runner/src/async_durable_execution_runner --cov-fail-under=95 packages/async-durable-execution-runner/tests_async_durable_execution_runner {args}"
typecheck = "mypy --install-types --non-interactive packages/async-durable-execution-runner/src/async_durable_execution_runner packages/async-durable-execution-runner/tests_async_durable_execution_runner"

[tool.hatch.envs.dev-examples]
workspace.members = [
  "packages/async-durable-execution",
  "packages/async-durable-execution-examples",
  "packages/async-durable-execution-runner",
]
dependencies = [
  "pytest",
  "pytest-asyncio",
]

[tool.hatch.envs.dev-examples.scripts]
test = "pytest packages/async-durable-execution-examples/tests_async_durable_execution_examples {args}"

[tool.hatch.envs.test-pypi-examples]
dependencies = [
  "async-durable-execution",
  "pytest",
  "pytest-asyncio",
]
pre-install-commands = [
  "pip install -e packages/async-durable-execution-runner",
  "pip install -e packages/async-durable-execution-examples",
]

[tool.hatch.envs.test-pypi-examples.scripts]
test = "pytest packages/async-durable-execution-examples/tests_async_durable_execution_examples {args}"

[tool.hatch.envs.examples]
workspace.members = [
  "packages/async-durable-execution",
  "packages/async-durable-execution-examples",
  "packages/async-durable-execution-runner",
]

[tool.hatch.envs.examples.scripts]
pip = "python -m pip {args}"
generate-sam-template = "python packages/async-durable-execution-examples/scripts/generate_sam_template.py {args}"
build = "python packages/async-durable-execution-examples/scripts/build_examples.py"
clean = "rm -rf packages/async-durable-execution-examples/build packages/async-durable-execution-examples/.aws-sam packages/async-durable-execution-examples/*.zip packages/async-durable-execution-examples/template.generated.json"

[tool.hatch.envs.docs]
workspace.members = ["packages/async-durable-execution"]
dependencies = ["pdoc>=15,<16"]

[tool.hatch.envs.docs.scripts]
build = "pdoc async_durable_execution -o site/api"
clean = "rm -rf site/api"

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [".github/scripts/*.sh", ".github/workflows"]

[tool.ruff.lint]
preview = true
select = []

[tool.ruff.lint.isort]
known-first-party = [
  "async_durable_execution",
  "async_durable_execution_examples",
  "async_durable_execution_runner",
]
force-single-line = false
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
"**/tests*/**" = [
  "ARG001",
  "ARG002",
  "ARG005",
  "S101",
  "PLR2004",
  "PLR6301",
  "SIM117",
  "TRY301",
]
"**/test/**" = [
  "ARG001",
  "ARG002",
  "ARG005",
  "S101",
  "PLR2004",
  "SIM117",
  "TRY301",
]
