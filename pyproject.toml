[project]
name = "async-durable-execution-monorepo"
dynamic = ["version"]
requires-python = ">=3.10"

[tool.hatch.version]
path = "VERSION.py"

[tool.hatch.envs.default]
workspace.members = [
  "async-durable-execution",
  "async-durable-execution-examples",
  "async-durable-execution-lambda-layer",
  "async-durable-execution-runner",
]

[tool.hatch.envs.test]
workspace.members = [
  "async-durable-execution",
  "async-durable-execution-examples",
  "async-durable-execution-lambda-layer",
  "async-durable-execution-runner",
]
dependencies = [
  "coverage[toml]",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "pytest-xdist",
]

[tool.hatch.envs.test.scripts]
all = "pytest {args}"
cov = "pytest --cov-report=term-missing --cov {args}"
examples-integration = "pytest --runner-mode=cloud async-durable-execution-examples/test_examples/ -v {args}"

[tool.pytest.ini_options]
# Declare custom markers to avoid warnings with --strict-markers
addopts = "-v --strict-markers --import-mode=importlib"
testpaths = [
    "async-durable-execution/test_sdk",
    "async-durable-execution-lambda-layer/test_layer",
    "async-durable-execution-runner/test_runner",
    "async-durable-execution-examples/test_examples",
]
markers = []
asyncio_mode = "auto"

[tool.hatch.envs.types]
workspace.members = [
  "async-durable-execution",
  "async-durable-execution-examples",
  "async-durable-execution-lambda-layer",
  "async-durable-execution-runner",
]
extra-dependencies = [
  "mypy>=1.0.0",
  "pytest",
  "botocore-stubs>=1.42.40,<1.43.0",
]

[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive --warn-unused-ignores {args:async-durable-execution/src/async_durable_execution async-durable-execution/test_sdk async-durable-execution-lambda-layer/src/async_durable_execution_lambda_layer async-durable-execution-lambda-layer/test_layer async-durable-execution-runner/src/async_durable_execution_runner async-durable-execution-runner/test_runner}"

[tool.hatch.envs.dev-core]
workspace.members = [
  "async-durable-execution",
  "async-durable-execution-lambda-layer",
  "async-durable-execution-runner",
]
dependencies = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "coverage[toml]",
  "mypy>=1.0.0",
  "botocore-stubs>=1.42.40,<1.43.0",
]

[tool.hatch.envs.dev-core.scripts]
test = "pytest async-durable-execution/test_sdk {args}"
cov = "pytest --cov-report=term-missing --cov-config=async-durable-execution/pyproject.toml --cov=async-durable-execution/src/async_durable_execution --cov-fail-under=98 async-durable-execution/test_sdk {args}"
typecheck = "mypy --install-types --non-interactive async-durable-execution/src/async_durable_execution async-durable-execution/test_sdk"

[tool.hatch.envs.dev-testing]
workspace.members = [
  "async-durable-execution",
  "async-durable-execution-lambda-layer",
  "async-durable-execution-runner",
]
dependencies = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "coverage[toml]",
  "mypy>=1.0.0",
]

[tool.hatch.envs.dev-testing.scripts]
test = "pytest async-durable-execution-runner/test_runner {args}"
cov = "pytest --cov-report=term-missing --cov-config=async-durable-execution-runner/pyproject.toml --cov=async-durable-execution-runner/src/async_durable_execution_runner --cov-fail-under=95 async-durable-execution-runner/test_runner {args}"
typecheck = "mypy --install-types --non-interactive async-durable-execution-runner/src/async_durable_execution_runner async-durable-execution-runner/test_runner"

[tool.hatch.envs.dev-examples]
workspace.members = [
  "async-durable-execution",
  "async-durable-execution-examples",
  "async-durable-execution-lambda-layer",
  "async-durable-execution-runner",
]
dependencies = [
  "pytest",
  "pytest-asyncio",
]

[tool.hatch.envs.dev-examples.scripts]
test = "pytest async-durable-execution-examples/test_examples {args}"

[tool.hatch.envs.test-pypi-examples]
dependencies = [
  "async-durable-execution",
  "pytest",
  "pytest-asyncio",
]
pre-install-commands = [
  "pip install -e async-durable-execution-runner",
  "pip install -e async-durable-execution-examples",
]

[tool.hatch.envs.test-pypi-examples.scripts]
test = "pytest async-durable-execution-examples/test_examples {args}"

[tool.hatch.envs.examples]
workspace.members = [
  "async-durable-execution",
  "async-durable-execution-examples",
  "async-durable-execution-lambda-layer",
  "async-durable-execution-runner",
]

[tool.hatch.envs.examples.scripts]
pip = "python -m pip {args}"
generate-sam-template = "python async-durable-execution-examples/scripts/generate_sam_template.py {args}"
build = "python async-durable-execution-examples/scripts/build_examples.py"
build-layer = "python -m async_durable_execution_lambda_layer.builder --sdk-source ./async-durable-execution --output async-durable-execution-lambda-layer/dist/async-durable-execution-layer.zip"
clean = "rm -rf async-durable-execution-examples/build async-durable-execution-examples/.aws-sam async-durable-execution-examples/*.zip async-durable-execution-examples/template.generated.json async-durable-execution-lambda-layer/dist"

[tool.hatch.envs.docs]
workspace.members = ["async-durable-execution"]
dependencies = ["pdoc>=15,<16"]

[tool.hatch.envs.docs.scripts]
build = "pdoc async_durable_execution -o site/api"
clean = "rm -rf site/api"

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [".github/scripts/*.sh", ".github/workflows"]

[tool.ruff.lint]
preview = true
select = []

[tool.ruff.lint.isort]
known-first-party = [
  "async_durable_execution",
  "async_durable_execution_examples",
  "async_durable_execution_lambda_layer",
  "async_durable_execution_runner",
]
force-single-line = false
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
"**/tests*/**" = [
  "ARG001",
  "ARG002",
  "ARG005",
  "S101",
  "PLR2004",
  "PLR6301",
  "SIM117",
  "TRY301",
]
"**/test/**" = [
  "ARG001",
  "ARG002",
  "ARG005",
  "S101",
  "PLR2004",
  "SIM117",
  "TRY301",
]
