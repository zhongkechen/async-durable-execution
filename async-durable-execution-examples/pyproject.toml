[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Modified fork metadata for async-durable-execution; upstream Apache-2.0 notices are preserved in the repository LICENSE and NOTICE files.
[project]
name = "async-durable-execution-examples"
dynamic = ["version"]
description = "Examples for the async durable execution Python packages"
requires-python = ">=3.10"
authors = [{ name = "Zhongke Chen" }]
dependencies = [
  "async-durable-execution[aioboto]>=2.0.0b2"
]

[tool.hatch.version]
path = "../VERSION.py"

[tool.hatch.build.targets.sdist.force-include]
"../LICENSE" = "LICENSE"
"../NOTICE" = "NOTICE"
"../VERSION.py" = "VERSION.py"

[tool.hatch.build.targets.sdist]
packages = ["src/async_durable_execution_examples"]

[tool.hatch.build.targets.wheel]
packages = ["src/async_durable_execution_examples"]

[tool.hatch.build.targets.wheel.force-include]
"../LICENSE" = "LICENSE"
"../NOTICE" = "NOTICE"
"../VERSION.py" = "VERSION.py"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
preview = true
select = []

[tool.ruff.lint.isort]
known-first-party = ["async_durable_execution_examples"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
"test_examples/**" = [
  "ARG001",
  "ARG002",
  "ARG005",
  "S101",
  "PLR2004",
  "SIM117",
  "TRY301",
]
